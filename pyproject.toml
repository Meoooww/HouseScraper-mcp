[project]
name = "housescraper-mcp"
version = "0.1.0"
description = "Local MCP server for real-estate listing discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "rich>=13,<15",
    "brotli>=1.1,<2",
    "websocket-client>=1.8,<2",
]

[project.scripts]
housescraper-mcp = "house_cli.main:cli"
housescraper-cli = "house_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/house_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
