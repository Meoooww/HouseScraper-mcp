[project]
name = "housescraper-mcp"
version = "0.1.0"
description = "Local MCP server for real-estate listing discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9,<2",
    "brotli>=1.1,<2",
    "websocket-client>=1.8,<2",
    "house-cli @ git+https://github.com/Luxuzhou/house-cli.git@3373ddbe7cdba78b1bcc39e9abd03a643b9f8fb4",
]

[project.scripts]
housescraper-mcp = "housescraper_mcp.server:main"
housescraper-cli = "housescraper_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/housescraper_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
